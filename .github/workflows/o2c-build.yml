name: O2C Orchestration CI

on:
  push:
    branches:
      - main
      - dhcm-finance-control-hub
  pull_request:
    branches:
      - main
      - dhcm-finance-control-hub

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Test Financial Invariants
        run: npm run test

      - name: Anti-Legacy Branding Regression Check
        run: npm run test:branding

      - name: Build
        run: npm run build
